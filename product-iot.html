<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>产品与服务 - 车载无线终端 - 天远科技集团</title>
  <style>
    :root {
      --header-h: 115px;
      --primary: #0b308e;
      --text: #3f3f3f;
      --phone: #949494;
      --bg: #ffffff;
      --max-w: 1920px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
      background: #f5f5f5;
      color: var(--text);
    }

    .page {
      max-width: var(--max-w);
      margin: 0 auto;
      background: var(--bg);
      overflow: hidden;
    }

    /* ===== 顶部导航（HTML 公共模块，sticky） ===== */
    .site-header {
      position: sticky;
      top: 0;
      height: var(--header-h);
      background: rgba(255, 255, 255, 0.98);
      z-index: 100;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 100%;
      padding: 0 80px;
    }

    .logo a {
      display: flex;
      align-items: center;
      height: var(--header-h);
    }

    .logo img {
      display: block;
      width: 260px;
      height: auto;
    }

    .main-nav {
      flex: 1;
      display: flex;
      justify-content: center;
    }

    .main-nav ul {
      display: flex;
      align-items: center;
      gap: 84px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .main-nav li { position: relative; }

    .main-nav a {
      display: block;
      font-size: 18px;
      line-height: var(--header-h);
      color: var(--text);
      text-decoration: none;
      white-space: nowrap;
      transition: color 0.2s;
    }

    .main-nav li.active > a { color: var(--primary); }

    .main-nav li.active::after {
      content: "";
      position: absolute;
      bottom: 7px;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--primary);
      border-radius: 2px;
    }

    .main-nav li:hover > a { color: var(--primary); }

    .dropdown {
      display: none;
      position: absolute;
      top: calc(var(--header-h) - 8px);
      left: 50%;
      transform: translateX(-50%);
      min-width: 220px;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      border-radius: 4px;
      padding: 8px 0;
    }

    .main-nav li:hover .dropdown { display: block; }

    .dropdown a {
      display: block;
      padding: 10px 24px;
      line-height: 1.5;
      font-size: 15px;
      color: var(--text);
    }

    .dropdown a:hover {
      color: var(--primary);
      background: #f7f8fa;
    }

    .phone {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 18px;
      color: var(--phone);
      white-space: nowrap;
    }

    .phone-icon {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
    }

    /* ===== 整块图区块（与设计图大模块一一对应） ===== */
    .section {
      width: 100%;
      line-height: 0;
    }

    .section img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* ===== 产品展示：卡片网格（设计稿 1920×1357，卡片 382×500） ===== */
    .iot-grid {
      position: relative;
      width: 100%;
      aspect-ratio: 1920 / 1357;
      background: #f7f8fc;
      line-height: 0;
    }

    .iot-card {
      position: absolute;
      display: block;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .iot-card img {
      display: block;
      width: 100%;
      height: 100%;
      line-height: 0;
    }

    .iot-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      z-index: 12;
    }

    /* 整卡点击区（在线询价按钮以外的位置均进入产品详情页） */
    .iot-card__link {
      position: absolute;
      inset: 0;
      z-index: 10;
      border-radius: 4px;
      text-decoration: none;
      outline: none;
    }

    .iot-card__link:focus-visible {
      outline: 3px solid var(--primary);
      outline-offset: 2px;
    }

    /* 在线询价按钮热区（叠在烘焙的蓝色按钮上） */
    .iot-card__inquiry {
      position: absolute;
      left: 15.968586387434556%;
      top: 74.2%;
      width: 68.32460732984293%;
      height: 11.2%;
      z-index: 11;
      display: block;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 2px;
      background: transparent;
      cursor: pointer;
    }

    .iot-card__inquiry:focus-visible {
      outline: 3px solid var(--primary);
      outline-offset: 2px;
    }

    /* ===== 通用弹窗（在线询价） ===== */
    .pp-modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(8, 18, 40, 0.55);
      -webkit-backdrop-filter: blur(2px);
      backdrop-filter: blur(2px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.25s cubic-bezier(0.23, 1, 0.32, 1),
                  visibility 0.25s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .pp-modal-overlay.is-open { opacity: 1; visibility: visible; pointer-events: auto; }
    .pp-modal {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 920px;
      max-height: 90vh;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 24px 70px rgba(8, 18, 40, 0.35);
      overflow: hidden;
      transform: scale(0.95);
      opacity: 0;
      transition: transform 0.25s cubic-bezier(0.23, 1, 0.32, 1),
                  opacity 0.25s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .pp-modal-overlay.is-open .pp-modal { transform: scale(1); opacity: 1; }
    .pp-modal__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid #eef0f4;
      flex: 0 0 auto;
    }
    .pp-modal__title { margin: 0; font-size: 17px; font-weight: 600; color: var(--primary, #0b308e); }
    .pp-modal__close {
      border: 0; background: transparent; font-size: 26px; line-height: 1;
      color: #8a92a6; cursor: pointer; width: 36px; height: 36px;
      border-radius: 8px; transition: background 0.15s ease, color 0.15s ease;
    }
    .pp-modal__close:hover { background: #f2f4f8; color: #0b308e; }

    /* 询价表单 */
    .pp-form { padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
    .pp-form__row { display: flex; flex-direction: column; gap: 6px; }
    .pp-form__row label { font-size: 13px; color: #4a5160; font-weight: 500; }
    .pp-form__row .req { color: #e8453c; }
    .pp-form input, .pp-form textarea {
      font: inherit; font-size: 14px; padding: 10px 12px; border: 1px solid #d7dce6;
      border-radius: 8px; color: #1c2230; background: #fff;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .pp-form input:focus, .pp-form textarea:focus {
      outline: none; border-color: #0b308e; box-shadow: 0 0 0 3px rgba(11, 48, 142, 0.12);
    }
    .pp-form input[readonly] { background: #f3f5f9; color: #6b7385; }
    .pp-modal__footer {
      display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px;
      border-top: 1px solid #eef0f4; flex: 0 0 auto;
    }
    .pp-btn {
      font: inherit; font-size: 14px; font-weight: 500; padding: 10px 20px; border-radius: 8px;
      border: 1px solid #d7dce6; background: #fff; color: #333; cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .pp-btn:hover { background: #f2f4f8; }
    .pp-btn:active { transform: scale(0.97); }
    .pp-btn--primary { background: #0b308e; border-color: #0b308e; color: #fff; }
    .pp-btn--primary:hover { background: #0a2a7d; }
    .pp-form__success {
      background: #e8f6ee; color: #1f7a45; border: 1px solid #b6e3c8;
      border-radius: 8px; padding: 10px 12px; font-size: 14px; text-align: center;
    }
    @media (prefers-reduced-motion: reduce) {
      .pp-modal-overlay, .pp-modal, .pp-modal-overlay.is-open .pp-modal { transition: opacity 0.2s ease; }
      .pp-modal { transform: none; }
      .iot-card { transition: none; }
      .iot-card:hover { transform: none; }
    }

    /* ===== 基础响应式（导航） ===== */
    @media (max-width: 1200px) {
      .header-inner { padding: 0 24px; }
      .main-nav ul { gap: 32px; }
    }
  </style>

        <h3 id="inquiryModalTitle" class="pp-modal__title">产品询价</h3>

      </div>
      <form class="pp-form" id="inquiryForm" novalidate>
        <div class="pp-form__row">
          <label for="iq-company">公司名称 <span class="req">*</span></label>
          <input type="text" id="iq-company" name="company" required placeholder="请输入公司名称">
        </div>
        <div class="pp-form__row">
          <label for="iq-model">产品型号</label>
          <input type="text" id="iq-model" name="model" readonly>

          <label for="iq-qty">数量 <span class="req">*</span></label>

        </div>
        <div class="pp-form__row">
          <label for="iq-name">姓名 <span class="req">*</span></label>
          <input type="text" id="iq-name" name="name" required placeholder="请输入您的姓名">
        </div>
        <div class="pp-form__row">
          <label for="iq-contact">联系方式 <span class="req">*</span></label>
          <input type="text" id="iq-contact" name="contact" required placeholder="电话或邮箱">
        </div>
        <div class="pp-form__row">
          <label for="iq-note">备注</label>
          <textarea id="iq-note" name="note" rows="3" placeholder="其他需求说明（选填）"></textarea>
        </div>
        <div class="pp-form__success" id="inquirySuccess" hidden>提交成功，我们会尽快与您联系！</div>
        <div class="pp-modal__footer">
          <button type="button" class="pp-btn" data-close>关闭</button>
          <button type="submit" class="pp-btn pp-btn--primary">提交询价</button>
        </div>
      </form>
    </div>

  <script>
  (function () {
    function openModal(ov) {
      ov.classList.add('is-open');
      ov.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      // 等样式生效后再聚焦，避免元素仍为 visibility:hidden 时 focus 失败
      requestAnimationFrame(function () {
        var c = ov.querySelector('[data-close]');
        if (c && c.focus) c.focus();
      });
    }
    function closeModal(ov) {
      ov.classList.remove('is-open');
      ov.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    // overlay click (outside modal) & close buttons
    document.querySelectorAll('.pp-modal-overlay').forEach(function (ov) {
      ov.addEventListener('click', function (e) { if (e.target === ov) closeModal(ov); });
      ov.querySelectorAll('[data-close]').forEach(function (b) {
        b.addEventListener('click', function () { closeModal(ov); });
      });
    });
    // Esc 关闭：挂在 document 上，焦点不在弹窗内时同样生效
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' || e.key === 'Esc') {
        document.querySelectorAll('.pp-modal-overlay.is-open').forEach(closeModal);
      }
    });

    // ---- 在线询价 ----
    var inquiryModal = document.getElementById('inquiryModal');
    var inquiryForm = document.getElementById('inquiryForm');
    var iqModel = document.getElementById('iq-model');
    var iqSuccess = document.getElementById('inquirySuccess');
    document.querySelectorAll('button.iot-card__inquiry').forEach(function (b) {
      b.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        inquiryForm.reset();
        iqSuccess.hidden = true;
        iqModel.value = b.getAttribute('data-model') || '';
        document.getElementById('inquiryModalTitle').textContent =
          (b.getAttribute('data-title') || '产品') + ' - 在线询价';
        openModal(inquiryModal);
      });
    });
    inquiryForm.addEventListener('submit', function (e) {
      e.preventDefault();
      if (!inquiryForm.checkValidity()) { inquiryForm.reportValidity(); return; }
      // 静默提交留资：不阻塞成功提示，后端不可用时也不影响用户
      try {
        var fd = new FormData(inquiryForm);
        var payload = Object.fromEntries(fd.entries());
        payload.source = location.pathname;
        fetch('/api/lead', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(payload)
        }).catch(function () {});
      } catch (err) {}
      iqSuccess.hidden = false;
      setTimeout(function () { closeModal(inquiryModal); }, 1600);
    });
  })();
  </script>
