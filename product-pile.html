  <link rel="stylesheet" href="assets/css/styles.css">
  <style>
    /* 设备展示 - 产品卡片点击区 */
    .equipment-section {
      position: relative;
      width: 100%;
      max-width: 1920px;
      margin: 0 auto;
      line-height: 0;
    }
    .equipment-section .mod {
      width: 100%;
      line-height: 0;
    }
    .equipment-section .mod img {
      display: block;
      width: 100%;
      height: auto;
    }
    .equipment-card {
      position: absolute;
      display: block;
      overflow: hidden;
      cursor: default;
      transition: transform 0.2s cubic-bezier(0.23, 1, 0.32, 1);
      z-index: 10;
    }
    .equipment-card:hover {
      transform: scale(1.02);
    }
    .equipment-card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
    }
    .equipment-card-pdf {
      position: absolute;
      display: block;
      overflow: hidden;
      cursor: pointer;
      z-index: 11;
      border-radius: 6px;
      background: transparent;
      transition: background 0.18s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .equipment-card-pdf:hover {
      background: rgba(11, 48, 142, 0.10);
    }
    .equipment-card-inquiry:focus-visible,
    .equipment-card-pdf:focus-visible {
      outline: 2px solid #0b308e;
      outline-offset: 2px;
    }
    @media (prefers-reduced-motion: reduce) {
      .equipment-card { transition: none; }
      .equipment-card:hover { transform: none; }
    }
    @media (hover: hover) and (pointer: fine) {
      .equipment-card:hover { transform: scale(1.02); }
    }

    /* ===== 产品卡片：在线询价 热区 ===== */
    .equipment-card-inquiry {
      position: absolute;
      display: block;
      border: 0;
      padding: 0;
      margin: 0;
      background: transparent;
      cursor: pointer;
      z-index: 11;
    }

    /* ===== 通用弹窗（PDF 预览 / 询价） ===== */
    .pp-modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(8, 18, 40, 0.55);
      -webkit-backdrop-filter: blur(2px);
      backdrop-filter: blur(2px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s cubic-bezier(0.23, 1, 0.32, 1),
                  visibility 0.25s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .pp-modal-overlay.is-open { opacity: 1; visibility: visible; }
    .pp-modal {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 920px;
      max-height: 90vh;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 24px 70px rgba(8, 18, 40, 0.35);
      overflow: hidden;
      transform: scale(0.95);
      opacity: 0;
      transition: transform 0.25s cubic-bezier(0.23, 1, 0.32, 1),
                  opacity 0.25s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .pp-modal-overlay.is-open .pp-modal { transform: scale(1); opacity: 1; }
    .pp-modal__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid #eef0f4;
      flex: 0 0 auto;
    }
    .pp-modal__title { margin: 0; font-size: 17px; font-weight: 600; color: var(--primary, #0b308e); }
    .pp-modal__close {
      border: 0; background: transparent; font-size: 26px; line-height: 1;
      color: #8a92a6; cursor: pointer; width: 36px; height: 36px;
      border-radius: 8px; transition: background 0.15s ease, color 0.15s ease;
    }
    .pp-modal__close:hover { background: #f2f4f8; color: #0b308e; }
    .pp-modal__body { position: relative; flex: 1 1 auto; min-height: 0; background: #f5f6f8; }
    .pp-modal__iframe { width: 100%; height: 78vh; border: 0; display: block; background: #fff; }
    .pp-modal__loading {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px; color: #6b7385; font-size: 14px;
    }
    .pp-spinner {
      width: 34px; height: 34px; border: 3px solid #d7dce6; border-top-color: #0b308e;
      border-radius: 50%; animation: pp-spin 0.8s linear infinite;
    }
    @keyframes pp-spin { to { transform: rotate(360deg); } }
    .pp-modal__error {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px; padding: 24px;
      text-align: center; color: #6b7385;
    }
    .pp-modal__error-title { font-size: 16px; font-weight: 600; color: #333; margin: 0; }
    .pp-modal__error-desc { margin: 0; font-size: 14px; }

    /* 询价表单 */
    .pp-form { padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
    .pp-form__row { display: flex; flex-direction: column; gap: 6px; }
    .pp-form__row label { font-size: 13px; color: #4a5160; font-weight: 500; }
    .pp-form__row .req { color: #e8453c; }
    .pp-form input, .pp-form textarea {
      font: inherit; font-size: 14px; padding: 10px 12px; border: 1px solid #d7dce6;
      border-radius: 8px; color: #1c2230; background: #fff;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .pp-form input:focus, .pp-form textarea:focus {
      outline: none; border-color: #0b308e; box-shadow: 0 0 0 3px rgba(11, 48, 142, 0.12);
    }
    .pp-form input[readonly] { background: #f3f5f9; color: #6b7385; }
    .pp-modal__footer {
      display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px;
      border-top: 1px solid #eef0f4; flex: 0 0 auto;
    }
    .pp-btn {
      font: inherit; font-size: 14px; font-weight: 500; padding: 10px 20px; border-radius: 8px;
      border: 1px solid #d7dce6; background: #fff; color: #333; cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .pp-btn:hover { background: #f2f4f8; }
    .pp-btn:active { transform: scale(0.97); }
    .pp-btn--primary { background: #0b308e; border-color: #0b308e; color: #fff; }
    .pp-btn--primary:hover { background: #0a2a7d; }
    .pp-form__success {
      background: #e8f6ee; color: #1f7a45; border: 1px solid #b6e3c8;
      border-radius: 8px; padding: 10px 12px; font-size: 14px; text-align: center;
    }
    @media (prefers-reduced-motion: reduce) {
      .pp-modal-overlay, .pp-modal, .pp-modal-overlay.is-open .pp-modal { transition: opacity 0.2s ease; }
      .pp-modal { transform: none; }
      .pp-spinner { animation: none; }
    }


    /* ===== v2 新原型（2026-10-29）：整块图分段 + 产品卡片图层 ===== */
    .case-section { position: relative; }

    .case-section .equipment-card-pdf { border-radius: 4px; }
    .case-section .equipment-card-pdf:hover { background: rgba(255, 255, 255, 0.14); }
  </style>

  <!-- 在线询价弹窗 -->
  <div class="pp-modal-overlay" id="inquiryModal" role="dialog" aria-modal="true" aria-labelledby="inquiryModalTitle">
    <div class="pp-modal">
      <div class="pp-modal__header">
        <h3 id="inquiryModalTitle" class="pp-modal__title">产品询价</h3>
        <button type="button" class="pp-modal__close" data-close aria-label="关闭">&times;</button>
      </div>
      <form class="pp-form" id="inquiryForm" novalidate>
        <div class="pp-form__row">
          <label for="iq-company">公司名称 <span class="req">*</span></label>
          <input type="text" id="iq-company" name="company" required placeholder="请输入公司名称">
        </div>
        <div class="pp-form__row">
          <label for="iq-model">产品型号</label>
          <input type="text" id="iq-model" name="model" readonly>
        </div>
        <div class="pp-form__row">
          <label for="iq-qty">数量 <span class="req">*</span></label>
          <input type="number" id="iq-qty" name="qty" min="1" required placeholder="请输入采购数量">
        </div>
        <div class="pp-form__row">
          <label for="iq-name">姓名 <span class="req">*</span></label>
          <input type="text" id="iq-name" name="name" required placeholder="请输入您的姓名">
        </div>
        <div class="pp-form__row">
          <label for="iq-contact">联系方式 <span class="req">*</span></label>
          <input type="text" id="iq-contact" name="contact" required placeholder="电话或邮箱">
        </div>
        <div class="pp-form__row">
          <label for="iq-note">备注</label>
          <textarea id="iq-note" name="note" rows="3" placeholder="其他需求说明（选填）"></textarea>
        </div>
        <div class="pp-form__success" id="inquirySuccess" hidden>提交成功，我们会尽快与您联系！</div>
        <div class="pp-modal__footer">
          <button type="button" class="pp-btn" data-close>关闭</button>
          <button type="submit" class="pp-btn pp-btn--primary">提交询价</button>
        </div>
      </form>
    </div>
  </div>

  <script>
  (function () {
    var EASE = 'cubic-bezier(0.23, 1, 0.32, 1)';
    function openModal(ov) {
      ov.classList.add('is-open');
      ov.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      var c = ov.querySelector('[data-close]');
      if (c) c.focus();
    }
    function closeModal(ov) {
      ov.classList.remove('is-open');
      ov.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }
    // overlay click (outside modal) & close buttons & Esc
    document.querySelectorAll('.pp-modal-overlay').forEach(function (ov) {
      ov.addEventListener('click', function (e) { if (e.target === ov) closeModal(ov); });
      ov.querySelectorAll('[data-close]').forEach(function (b) {
        b.addEventListener('click', function () { closeModal(ov); });
      });
      ov.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(ov); });
    });

    // ---- PDF preview modal ----
    var pdfModal = document.getElementById('pdfModal');
    var pdfFrame = document.getElementById('pdfFrame');
    var pdfLoading = document.getElementById('pdfLoading');
    var pdfError = document.getElementById('pdfError');
    var pdfErrorDesc = document.getElementById('pdfErrorDesc');
    var pdfDownloadLink = document.getElementById('pdfDownloadLink');
    var pdfTitle = document.getElementById('pdfModalTitle');

    function showPdfError(msg, url) {
      pdfLoading.hidden = true;
      pdfFrame.style.display = 'none';
      pdfErrorDesc.textContent = msg;
      pdfDownloadLink.href = url;
      pdfError.hidden = false;
    }
    function openPdf(url, title) {
      pdfTitle.textContent = (title || '产品资料') + ' - PDF 预览';
      pdfError.hidden = true;
      pdfFrame.style.display = 'none';
      pdfLoading.hidden = false;
      pdfFrame.src = '';
      openModal(pdfModal);
      pdfFrame.onload = function () { pdfLoading.hidden = true; pdfFrame.style.display = 'block'; };
      fetch(url, { method: 'HEAD' })
        .then(function (res) {
          if (!res.ok) { showPdfError('该产品的 PDF 资料暂未提供，请稍后再试或联系我们。', url); return; }
          var ct = res.headers.get('content-type') || '';
          if (ct.indexOf('pdf') === -1) { showPdfError('PDF 文件格式异常，无法预览。', url); return; }
          pdfFrame.src = url;
        })
        .catch(function () {
          // fetch unavailable (file:// or CORS) -> best-effort direct load
          pdfFrame.src = url;
          pdfLoading.hidden = true;
          pdfFrame.style.display = 'block';
        });
    }
    document.querySelectorAll('a.equipment-card-pdf').forEach(function (a) {
      a.addEventListener('click', function (e) {
        e.preventDefault();
        openPdf(a.getAttribute('data-pdf'), a.getAttribute('data-title'));
      });
    });

    // ---- Inquiry modal ----
    var inquiryModal = document.getElementById('inquiryModal');
    var inquiryForm = document.getElementById('inquiryForm');
    var iqModel = document.getElementById('iq-model');
    var iqSuccess = document.getElementById('inquirySuccess');
    document.querySelectorAll('button.equipment-card-inquiry').forEach(function (b) {
      b.addEventListener('click', function () {
        inquiryForm.reset();
        iqSuccess.hidden = true;
        iqModel.value = b.getAttribute('data-model') || '';
        document.getElementById('inquiryModalTitle').textContent =
          (b.getAttribute('data-title') || '产品') + ' - 在线询价';
        openModal(inquiryModal);
      });
    });
    inquiryForm.addEventListener('submit', function (e) {
      e.preventDefault();
      if (!inquiryForm.checkValidity()) { inquiryForm.reportValidity(); return; }
      // 静默提交留资：不阻塞成功提示，后端不可用时也不影响用户
      try {
        var fd = new FormData(inquiryForm);
        var payload = Object.fromEntries(fd.entries());
        payload.source = location.pathname;
        fetch('/api/lead', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(payload)
        }).catch(function () {});
      } catch (err) {}
      iqSuccess.hidden = false;
      setTimeout(function () { closeModal(inquiryModal); }, 1600);
    });
  })();
  </script>
