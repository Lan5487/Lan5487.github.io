<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PC225LC-11M0 小松液压挖掘机 - 二手机销售与租赁 - 天远科技集团</title>
  <style>
    :root {
      --header-h: 115px;
      --primary: #0b308e;
      --text: #3f3f3f;
      --phone: #949494;
      --bg: #ffffff;
      --max-w: 1920px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
      background: #f5f5f5;
      color: var(--text);
    }

    .page {
      max-width: var(--max-w);
      margin: 0 auto;
      background: var(--bg);
      overflow: hidden;
    }

    /* ===== 顶部导航（HTML 公共模块，sticky） ===== */
    .site-header {
      position: sticky;
      top: 0;
      height: var(--header-h);
      background: rgba(255, 255, 255, 0.98);
      z-index: 100;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 100%;
      padding: 0 80px;
    }

    .logo a {
      display: flex;
      align-items: center;
      height: var(--header-h);
    }

    .logo img {
      display: block;
      width: 260px;
      height: auto;
    }

    .main-nav {
      flex: 1;
      display: flex;
      justify-content: center;
    }

    .main-nav ul {
      display: flex;
      align-items: center;
      gap: 84px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .main-nav li { position: relative; }

    .main-nav a {
      display: block;
      font-size: 18px;
      line-height: var(--header-h);
      color: var(--text);
      text-decoration: none;
      white-space: nowrap;
      transition: color 0.2s;
    }

    .main-nav li.active > a { color: var(--primary); }

    .main-nav li.active::after {
      content: "";
      position: absolute;
      bottom: 7px;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--primary);
      border-radius: 2px;
    }

    .main-nav li:hover > a { color: var(--primary); }

    .dropdown {
      display: none;
      position: absolute;
      top: calc(var(--header-h) - 8px);
      left: 50%;
      transform: translateX(-50%);
      min-width: 220px;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      border-radius: 4px;
      padding: 8px 0;
    }

    .main-nav li:hover .dropdown { display: block; }

    .dropdown a {
      display: block;
      padding: 10px 24px;
      line-height: 1.5;
      font-size: 15px;
      color: var(--text);
    }

    .dropdown a:hover {
      color: var(--primary);
      background: #f7f8fa;
    }

    .phone {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 18px;
      color: var(--phone);
      white-space: nowrap;
    }

    .phone-icon {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
    }

    /* ===== 面包屑导航 ===== */
    .breadcrumb {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 20px 80px 0;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: var(--phone);
      background: var(--bg);
      flex-wrap: wrap;
    }

    .breadcrumb a {
      color: var(--text);
      text-decoration: none;
      transition: color 0.2s;
    }

    .breadcrumb a:hover { color: var(--primary); }

    .breadcrumb .sep { color: var(--phone); }

    .breadcrumb .current {
      color: var(--primary);
      font-weight: 500;
    }

    /* ===== 返回设备列表（面包屑下方，纯文字链） ===== */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 16px 80px 0;
      font-size: 14px;
      line-height: 1.5;
      color: var(--primary);
      text-decoration: none;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: #082466;
      text-decoration: underline;
    }

    .back-link:focus-visible {
      outline: 3px solid var(--primary);
      outline-offset: 2px;
    }

    /* ===== 详情页各模块 ===== */
    .section {
      width: 100%;
      line-height: 0;
    }

    .section > img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* 产品主体区块（承载「在线询价」可点覆盖层） */
    .product-section {
      position: relative;
      max-width: var(--max-w);
      margin: 0 auto;
    }

    /* ===== 多角度图片预览（缩略图列 + 大图 + 视图标签） =====
       底图上原本烘焙着这 17 处像素，已抹白，改由下列真实图层呈现；
       静止态与原设计稿逐像素一致（已用脚本重拼校验 maxdiff=0）。
       坐标全部由设计稿实测像素换算（产品图 1920x989），沿用
       iot-mt720.html 的描边/过渡规范：选中 #0b308e、未选中 #dadada。 */

    /* 左侧缩略图列：x 161 / 宽 152 */
    .pp-thumbs {
      position: absolute;
      left: 8.3854166667%;    /* 161 / 1920 */
      top: 0;
      width: 7.9166666667%;   /* 152 / 1920 */
      height: 100%;
      pointer-events: none;   /* 仅按钮本身可点，空隙不拦截事件 */
    }

    .pp-thumb {
      position: absolute;
      left: 0;
      width: 100%;
      height: 10.5156723964%; /* 104 / 989 */
      padding: 0;
      margin: 0;
      background: #ffffff;
      border: 1px solid #dadada;   /* 未选中：设计稿取样 rgb(218,218,218) */
      border-radius: 0;
      cursor: pointer;
      overflow: hidden;
      pointer-events: auto;
      transition: border-color 0.2s ease;
    }

    /* 顶边 y = 170 / 278 / 386 / 494 / 602（设计稿 811/919/1027/1135/1243 - 641） */
    .pp-thumb:nth-child(1) { top: 17.1890798787%; }
    .pp-thumb:nth-child(2) { top: 28.1092012133%; }
    .pp-thumb:nth-child(3) { top: 39.0293225480%; }
    .pp-thumb:nth-child(4) { top: 49.9494438827%; }
    .pp-thumb:nth-child(5) { top: 60.8695652174%; }

    .pp-thumb.is-active {
      border-color: #0b308e;       /* 选中：设计稿取样 rgb(11,48,142) */
    }

    .pp-thumb:focus-visible {
      outline: 3px solid var(--primary);
      outline-offset: 2px;
    }

    .pp-thumb img {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 大图预览区：x 353 / y 222 / 620x424 */
    .pp-stage {
      position: absolute;
      left: 18.3854166667%;   /* 353 / 1920 */
      top: 22.4469160768%;    /* 222 / 989  */
      width: 32.2916666667%;  /* 620 / 1920 */
      height: 42.8715874621%; /* 424 / 989  */
      pointer-events: none;
    }

    /* 视图标签：x 350 / y 664 / 110x37 */
    .pp-labels {
      position: absolute;
      left: 18.2291666667%;   /* 350 / 1920 */
      top: 67.1385237614%;    /* 664 / 989  */
      width: 5.7291666667%;   /* 110 / 1920 */
      height: 3.7411526795%;  /* 37 / 989   */
      pointer-events: none;
    }

    /* 大图与标签都是多层叠放：切换时新图在上层淡入，旧图保持不透明压在其下
       → 不闪烁、不留白（与 iot-mt720.html 一致） */
    .pp-view,
    .pp-label {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      opacity: 0;
      z-index: 1;
      transition: opacity 0.3s ease;
    }

    .pp-view.is-current,
    .pp-label.is-current {
      opacity: 1;
      z-index: 3;
    }

    .pp-view.is-outgoing,
    .pp-label.is-outgoing {
      opacity: 1;
      z-index: 2;
    }

    /* 在线询价按钮覆盖层：
       按钮外观本身就是设计稿整张产品图上的像素，本层只负责
       手型光标 / 悬停与按下反馈 / 键盘可聚焦，不重复画按钮。
       定位值全部由设计稿实测像素换算而来（产品图 1920x989）：
       x[1050,1310] y[640,695] -> 261x56 */
    .inquiry-btn {
      position: absolute;
      left: 54.6875%;      /* 1050 / 1920 */
      top: 64.7118%;       /* 640 / 989  */
      width: 13.5937%;     /* 261 / 1920 */
      aspect-ratio: 261 / 56;
      height: auto;
      padding: 0;
      border: 0;
      border-radius: 4px;
      background: transparent;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
      transition: background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .inquiry-btn:hover { background-color: rgba(0, 0, 0, 0.12); }

    .inquiry-btn:active { background-color: rgba(0, 0, 0, 0.22); }

    .inquiry-btn:focus-visible {
      outline: 3px solid var(--primary);
      outline-offset: 2px;
    }

    /* ===== 基础响应式 ===== */
    @media (max-width: 1200px) {
      .header-inner { padding: 0 24px; }
      .main-nav ul { gap: 32px; }
      .breadcrumb { padding-left: 24px; padding-right: 24px; }
      .back-link { margin-left: 24px; margin-right: 24px; }
    }
  </style>
</head>
<body>
  <div class="page">

    <!-- 顶部导航（HTML 公共模块，sticky 吸顶） -->
    <div id="site-header"></div>
<script src="assets/js/site-header.js"></script>

    <!-- 面包屑导航 -->
    <nav class="breadcrumb" aria-label="面包屑">
      <a href="scene-1.html">产品与服务</a>
      <span class="sep">›</span>
      <a href="product-secondhand.html">二手机销售与租赁</a>
      <span class="sep">›</span>
      <span class="current">设备详情</span>
    </nav>

    <!-- 返回设备列表 -->
    <a href="product-secondhand.html#devices-grid" class="back-link" aria-label="返回设备列表">&#8592; 返回设备列表</a>

    <!-- 详情页主体：banner / 产品区 / footer -->

    <!-- 模块 1：蓝色科技 Banner -->
    <section class="section" id="banner">
      <img src="assets/img/erji/pc225lc-11m0/pc225lc-11m0-banner.png" alt="PRODUCTS &amp; SERVICES - 二手机销售与租赁业务 - 小松 PC225LC-11M0 液压挖掘机详情页">
    </section>

    <!-- 模块 2：产品主体（左侧 5 张缩略图 + 主图；右侧标题 / 基本信息 / 服务保障 / 在线询价，整块 1:1 还原） -->
    <section class="section product-section" id="product" aria-label="小松 PC225LC-11M0 液压挖掘机产品信息">
      <img src="assets/img/erji/pc225lc-11m0/pc225lc-11m0-product.png" alt="小松 PC225LC-11M0 液压挖掘机 - 多角度缩略图 / 主图 / 生产年份 2024.01 / 工作小时数 2335.4 H / 工作重量 23000~23600 kg / 铲斗容量 1.2~1.4 m³ / 无维修史 再制造 原厂配件 无事故记录 / 在线询价">

      <!-- 左侧多角度缩略图：默认第 1 张选中（蓝框），其余灰框 -->
      <div class="pp-thumbs" role="group" aria-label="PC225LC-11M0 多角度产品图切换">
        <button type="button" class="pp-thumb is-active" aria-pressed="true" aria-label="查看 左侧 视角">
          <img src="assets/img/erji/pc225lc-11m0/preview/pc225lc-11m0-thumb-1.png" alt="左侧视角缩略图">
        </button>
        <button type="button" class="pp-thumb" aria-pressed="false" aria-label="查看 配重 视角">
          <img src="assets/img/erji/pc225lc-11m0/preview/pc225lc-11m0-thumb-2.png" alt="配重视角缩略图">
        </button>
        <button type="button" class="pp-thumb" aria-pressed="false" aria-label="查看 液压泵 视角">
          <img src="assets/img/erji/pc225lc-11m0/preview/pc225lc-11m0-thumb-3.png" alt="液压泵视角缩略图">
        </button>
        <button type="button" class="pp-thumb" aria-pressed="false" aria-label="查看 驾驶室 视角">
          <img src="assets/img/erji/pc225lc-11m0/preview/pc225lc-11m0-thumb-4.png" alt="驾驶室视角缩略图">
        </button>
        <button type="button" class="pp-thumb" aria-pressed="false" aria-label="查看 发动机 视角">
          <img src="assets/img/erji/pc225lc-11m0/preview/pc225lc-11m0-thumb-5.png" alt="发动机视角缩略图">
        </button>
      </div>

      <!-- 大图预览区：5 层叠放，切换时新图淡入、旧图垫底 -->
      <div class="pp-stage">
        <img class="pp-view is-current" src="assets/img/erji/pc225lc-11m0/preview/pc225lc-11m0-view-1.png" alt="PC225LC-11M0 左侧视角大图">
        <img class="pp-view" src="assets/img/erji/pc225lc-11m0/preview/pc225lc-11m0-view-2.png" alt="PC225LC-11M0 配重视角大图" aria-hidden="true">
        <img class="pp-view" src="assets/img/erji/pc225lc-11m0/preview/pc225lc-11m0-view-3.png" alt="PC225LC-11M0 液压泵视角大图" aria-hidden="true">
        <img class="pp-view" src="assets/img/erji/pc225lc-11m0/preview/pc225lc-11m0-view-4.png" alt="PC225LC-11M0 驾驶室视角大图" aria-hidden="true">
        <img class="pp-view" src="assets/img/erji/pc225lc-11m0/preview/pc225lc-11m0-view-5.png" alt="PC225LC-11M0 发动机视角大图" aria-hidden="true">
      </div>

      <!-- 视图标签（随大图一同切换）：左侧 / 配重 / 液压泵 / 驾驶室 / 发动机 -->
      <div class="pp-labels" aria-hidden="true">
        <img class="pp-label is-current" src="assets/img/erji/pc225lc-11m0/preview/pc225lc-11m0-label-1.png" alt="">
        <img class="pp-label" src="assets/img/erji/pc225lc-11m0/preview/pc225lc-11m0-label-2.png" alt="">
        <img class="pp-label" src="assets/img/erji/pc225lc-11m0/preview/pc225lc-11m0-label-3.png" alt="">
        <img class="pp-label" src="assets/img/erji/pc225lc-11m0/preview/pc225lc-11m0-label-4.png" alt="">
        <img class="pp-label" src="assets/img/erji/pc225lc-11m0/preview/pc225lc-11m0-label-5.png" alt="">
      </div>

      <!-- 在线询价按钮：透明覆盖层，按钮外观来自上方产品图，本层提供点击反馈（无提交逻辑） -->
      <button type="button" class="inquiry-btn" aria-label="在线询价"></button>
    </section>


    <div id="site-footer-new"></div>
    <script src="assets/js/site-footer.js"></script>
  </div>

  <!-- 多角度图片预览切换：纯原生、无依赖；15 张图随页面一同加载，点击只切 class，
       故不会闪烁、也不会出现空白（新图淡入、旧图垫底） -->
  <script>
    (function () {
      var root = document.getElementById('product');
      if (!root) return;

      // 顺序必须一致：pp-thumb 第 i 个 ↔ pp-view / pp-label 第 i 个
      var thumbs = Array.prototype.slice.call(root.querySelectorAll('.pp-thumb'));
      var views = Array.prototype.slice.call(root.querySelectorAll('.pp-view'));
      var labels = Array.prototype.slice.call(root.querySelectorAll('.pp-label'));
      var cur = 0;

      function fade(group, i) {
        group.forEach(function (el, k) {
          el.classList.remove('is-current', 'is-outgoing');
          if (k === i) {
            el.classList.add('is-current');            // 新图置于最上层，淡入
            el.removeAttribute('aria-hidden');
          } else if (k === cur) {
            el.classList.add('is-outgoing');           // 旧图保持不透明，压在新图下面
            el.setAttribute('aria-hidden', 'true');
          } else {
            el.setAttribute('aria-hidden', 'true');
          }
        });
      }

      function select(i) {
        if (i === cur || !views[i]) return;

        thumbs.forEach(function (btn, k) {
          var on = (k === i);
          btn.classList.toggle('is-active', on);
          btn.setAttribute('aria-pressed', on ? 'true' : 'false');
        });

        fade(views, i);
        fade(labels, i);

        cur = i;
      }

      thumbs.forEach(function (btn, i) {
        btn.addEventListener('click', function () { select(i); });
      });
    })();
  </script>
</body>
