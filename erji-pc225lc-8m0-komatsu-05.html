<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PC225LC-8M0 小松液压挖掘机（驾驶室） - 二手机销售与租赁 - 天远科技集团</title>
  <style>
    :root {
      --header-h: 115px;
      --primary: #0b308e;
      --text: #3f3f3f;
      --phone: #949494;
      --bg: #ffffff;
      --max-w: 1920px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
      background: #f5f5f5;
      color: var(--text);
    }

    .page {
      max-width: var(--max-w);
      margin: 0 auto;
      background: var(--bg);
      overflow: hidden;
    }

    /* ===== 顶部导航（HTML 公共模块，sticky） ===== */
    .site-header {
      position: sticky;
      top: 0;
      height: var(--header-h);
      background: rgba(255, 255, 255, 0.98);
      z-index: 100;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 100%;
      padding: 0 80px;
    }

    .logo a {
      display: flex;
      align-items: center;
      height: var(--header-h);
    }

    .logo img {
      display: block;
      width: 260px;
      height: auto;
    }

    .main-nav {
      flex: 1;
      display: flex;
      justify-content: center;
    }

    .main-nav ul {
      display: flex;
      align-items: center;
      gap: 84px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .main-nav li { position: relative; }

    .main-nav a {
      display: block;
      font-size: 18px;
      line-height: var(--header-h);
      color: var(--text);
      text-decoration: none;
      white-space: nowrap;
      transition: color 0.2s;
    }

    .main-nav li.active > a { color: var(--primary); }

    .main-nav li.active::after {
      content: "";
      position: absolute;
      bottom: 7px;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--primary);
      border-radius: 2px;
    }

    .main-nav li:hover > a { color: var(--primary); }

    .dropdown {
      display: none;
      position: absolute;
      top: calc(var(--header-h) - 8px);
      left: 50%;
      transform: translateX(-50%);
      min-width: 220px;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      border-radius: 4px;
      padding: 8px 0;
    }

    .main-nav li:hover .dropdown { display: block; }

    .dropdown a {
      display: block;
      padding: 10px 24px;
      line-height: 1.5;
      font-size: 15px;
      color: var(--text);
    }

    .dropdown a:hover {
      color: var(--primary);
      background: #f7f8fa;
    }

    .phone {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 18px;
      color: var(--phone);
      white-space: nowrap;
    }

    .phone-icon {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
    }

    /* ===== 面包屑导航 ===== */
    .breadcrumb {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 20px 80px 0;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: var(--phone);
      background: var(--bg);
      flex-wrap: wrap;
    }

    .breadcrumb a {
      color: var(--text);
      text-decoration: none;
      transition: color 0.2s;
    }

    .breadcrumb a:hover { color: var(--primary); }

    .breadcrumb .sep { color: var(--phone); }

    .breadcrumb .current {
      color: var(--primary);
      font-weight: 500;
    }

    /* ===== 详情页各模块 ===== */
    .section {
      width: 100%;
      line-height: 0;
    }

    .section > img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* 产品主体区块：承载返回列表切片覆盖层 */
    .product-section {
      position: relative;
      max-width: var(--max-w);
      margin: 0 auto;
    }

    .back-link-overlay {
      position: absolute;
      top: 23.05%;
      right: 8.125%;
      width: 4.896%;
      z-index: 2;
      display: block;
      border-radius: 4px;
      transition: opacity 0.2s ease, box-shadow 0.2s ease;
    }

    .back-link-overlay img {
      display: block;
      width: 100%;
      height: auto;
    }

    .back-link-overlay:hover {
      opacity: 0.8;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .back-link-overlay:focus-visible {
      outline: 3px solid var(--primary);
      outline-offset: 2px;
    }

    /* 产品缩略图卡片（覆盖在产品图左侧） */
    .thumbnail-cards {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .thumbnail-card {
      position: absolute;
      left: 8.333%;
      width: 8.073%;
      pointer-events: auto;
      display: block;
      border-radius: 4px;
      overflow: hidden;
      background: #fff;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .thumbnail-card img {
      display: block;
      width: 100%;
      height: auto;
    }

    .thumbnail-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
    }

    .thumbnail-card:focus-visible {
      outline: 3px solid var(--primary);
      outline-offset: 2px;
    }

    /* ===== 基础响应式 ===== */
    @media (max-width: 1200px) {
      .header-inner { padding: 0 24px; }
      .main-nav ul { gap: 32px; }
      .breadcrumb { padding-left: 24px; padding-right: 24px; }
    }
  </style>
</head>
