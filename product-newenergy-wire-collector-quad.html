<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>产品与服务-新能源改装/部件产品 - 天远科技集团</title>
  <style>
    :root {
      --primary: #0b308e;
      --text: #3f3f3f;
      --phone: #949494;
      --bg: #ffffff;
      --max-w: 1920px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
      background: #f5f5f5;
      color: var(--text);
    }

    .page {
      max-width: var(--max-w);
      margin: 0 auto;
      background: var(--bg);
      overflow: hidden;
    }

    /* ===== 面包屑导航 ===== */
    .breadcrumb {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 20px 80px 0;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: var(--phone);
      background: var(--bg);
      flex-wrap: wrap;
    }

    .breadcrumb a {
      color: var(--text);
      text-decoration: none;
      transition: color 0.2s;
    }

    .breadcrumb a:hover { color: var(--primary); }

    .breadcrumb .sep { color: var(--phone); }

    .breadcrumb .current {
      color: var(--primary);
      font-weight: 500;
    }

    /* ===== 返回按钮 ===== */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 16px 80px 0;
      font-size: 14px;
      color: var(--primary);
      text-decoration: none;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: #082466;
      text-decoration: underline;
    }

    /* ===== 详情页主体 ===== */
    .detail-wrap {
      width: 100%;
      background: var(--bg);
      text-align: center;
      padding: 0;
    }

    .detail-wrap img {
      display: block;
      width: 100%;
      height: auto;
      max-width: var(--max-w);
      margin: 0 auto;
    }

    /* ===== 基础响应式 ===== */
    @media (max-width: 1200px) {
      .breadcrumb { padding-left: 24px; padding-right: 24px; }
      .back-link { margin-left: 24px; margin-right: 24px; }
    }
  </style>
</head>
<body>
<div id="site-header"></div>
<script src="assets/js/site-header.js"></script>
  <div class="page">

    <!-- 面包屑导航 -->
    <nav class="breadcrumb" aria-label="面包屑">
      <a href="scene-1.html">产品与服务</a>
      <span class="sep">&gt;</span>
      <a href="scene-1.html?sel=parts-retractor">部件产品</a>
      <span class="sep">&gt;</span>
      <span class="current">上送电四轮收线器</span>
    </nav>

    <!-- 返回产品列表 -->
    <a href="scene-1.html?sel=parts-retractor" class="back-link" aria-label="返回产品列表">&lt; 返回产品列表</a>

    <!-- 产业详情主体（完整展示设计稿） -->
    <main class="detail-wrap" aria-label="上送电四轮收线器 产业详情">
      <img src="assets/img/product-newenergy/detail/wire-collector-quad.png" alt="上送电四轮收线器 产业详情">
    </main>

    <div id="site-footer-new"></div>
    <script src="assets/js/site-footer.js"></script>


  </div>
</body>
</html>
