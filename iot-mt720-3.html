<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MT720 车载无线终端（背面） - 物联网终端 - 天远科技集团</title>
  <style>
    :root {
      --header-h: 115px;
      --primary: #0b308e;
      --text: #3f3f3f;
      --phone: #949494;
      --bg: #ffffff;
      --max-w: 1920px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
      background: #f5f5f5;
      color: var(--text);
    }

    .page {
      max-width: var(--max-w);
      margin: 0 auto;
      background: var(--bg);
      overflow: hidden;
    }

    /* ===== 顶部导航（HTML 公共模块，sticky） ===== */
    .site-header {
      position: sticky;
      top: 0;
      height: var(--header-h);
      background: rgba(255, 255, 255, 0.98);
      z-index: 100;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 100%;
      padding: 0 80px;
    }

    .logo a {
      display: flex;
      align-items: center;
      height: var(--header-h);
    }

    .logo img {
      display: block;
      width: 260px;
      height: auto;
    }

    .main-nav {
      flex: 1;
      display: flex;
      justify-content: center;
    }

    .main-nav ul {
      display: flex;
      align-items: center;
      gap: 84px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .main-nav li { position: relative; }

    .main-nav a {
      display: block;
      font-size: 18px;
      line-height: var(--header-h);
      color: var(--text);
      text-decoration: none;
      white-space: nowrap;
      transition: color 0.2s;
    }

    .main-nav li.active > a { color: var(--primary); }

    .main-nav li.active::after {
      content: "";
      position: absolute;
      bottom: 7px;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--primary);
      border-radius: 2px;
    }

    .main-nav li:hover > a { color: var(--primary); }

    .dropdown {
      display: none;
      position: absolute;
      top: calc(var(--header-h) - 8px);
      left: 50%;
      transform: translateX(-50%);
      min-width: 220px;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      border-radius: 4px;
      padding: 8px 0;
    }

    .main-nav li:hover .dropdown { display: block; }

    .dropdown a {
      display: block;
      padding: 10px 24px;
      line-height: 1.5;
      font-size: 15px;
      color: var(--text);
    }

    .dropdown a:hover {
      color: var(--primary);
      background: #f7f8fa;
    }

    .phone {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 18px;
      color: var(--phone);
      white-space: nowrap;
    }

    .phone-icon {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
    }

    /* ===== 面包屑导航 ===== */
    .breadcrumb {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 20px 80px 0;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: var(--phone);
      background: var(--bg);
      flex-wrap: wrap;
    }

    .breadcrumb a {
      color: var(--text);
      text-decoration: none;
      transition: color 0.2s;
    }

    .breadcrumb a:hover {
      color: var(--primary);
    }

    .breadcrumb .sep {
      color: var(--phone);
    }

    .breadcrumb .current {
      color: var(--primary);
      font-weight: 500;
    }

    /* ===== 返回按钮 ===== */
    .back-link {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 16px 80px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--primary);
      text-decoration: none;
      background: var(--bg);
      transition: color 0.2s;
    }

    .back-link:hover {
      color: #082466;
      text-decoration: underline;
    }

    /* ===== 详情页各模块（按设计图大区块） ===== */
    .section {
      width: 100%;
      line-height: 0;
    }

    .section img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* ===== 产品缩略图热区（透明覆盖层，保持原图视觉不变） ===== */
    .product-section {
      position: relative;
    }

    .thumbnail-cards {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    .thumbnail-card {
      position: absolute;
      display: block;
      pointer-events: auto;
      text-decoration: none;
      background: transparent;
      border-radius: 2px;
      transition: background 0.15s ease;
    }

    .thumbnail-card:hover {
      background: rgba(11, 48, 142, 0.04);
      cursor: pointer;
    }

    .thumbnail-card:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 1px;
    }

    .thumbnail-card.current {
      pointer-events: none;
      cursor: default;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* ===== 基础响应式 ===== */
    @media (max-width: 1200px) {
      .header-inner { padding: 0 24px; }
      .main-nav ul { gap: 32px; }
      .breadcrumb, .back-link { padding-left: 24px; padding-right: 24px; }
    }
  </style>
</head>
<body>
  <div class="page">

    <!-- 顶部导航（HTML 公共模块，sticky 吸顶） -->
    <div id="site-header"></div>
<script src="assets/js/site-header.js"></script>

    <!-- 面包屑导航（HTML 元素） -->
    <nav class="breadcrumb" aria-label="面包屑">
      <a href="index.html">首页</a>
      <span class="sep">›</span>
      <a href="scene-1.html">产品与服务</a>
      <span class="sep">›</span>
      <a href="product-iot.html">物联网终端</a>
      <span class="sep">›</span>
      <span class="current">MT720（背面）</span>
    </nav>

    <!-- 返回入口（HTML 元素） -->
    <a href="product-iot.html" class="back-link" aria-label="返回产品列表">‹ 返回产品列表</a>

    <!-- 详情页主体：4 个大区块（与设计稿大模块一一对应） -->

    <!-- 模块 1：蓝色科技 Banner（PRODUCTS & SERVICES / 物联终端） -->
    <section class="section" id="banner">
      <img src="assets/img/product-iot/iot-subpage-hero.png" alt="天远科技集团 车载无线终端">
    </section>

    <!-- 模块 2：产品主体（多图切换：3 缩略图 + 1 大主图 + 典型应用 + 在线询价） -->
    <section class="section product-section inquiry-host" id="product" aria-label="MT720 车载无线终端产品信息">
      <!-- 产品缩略图热区：透明覆盖层，保持原图视觉不变 -->
      <div class="thumbnail-cards" aria-label="产品多角度缩略图">
        <a href="iot-mt720.html" class="thumbnail-card" style="top:24.44%; left:8.33%; width:7.86%; height:8.35%;" aria-label="MT720 车载无线终端 - 默认视角" tabindex="0">
          <span class="sr-only">默认视角</span>
        </a>
        <a href="iot-mt720-2.html" class="thumbnail-card" style="top:39.40%; left:8.33%; width:7.86%; height:5.11%;" aria-label="MT720 车载无线终端 - 正面接口视角" tabindex="0">
          <span class="sr-only">正面接口视角</span>
        </a>
        <span class="thumbnail-card current" style="top:50.50%; left:8.33%; width:7.86%; height:8.73%;" aria-label="MT720 车载无线终端 - 当前视角（背面）">
          <span class="sr-only">当前视角（背面）</span>
        </span>
      </div>
      <img src="assets/img/product-iot/mt720/mt720-product-03.png" alt="MT720 车载无线终端（背面） - 多角度产品图 + 典型应用（新能源混合动力控制机、新能源油改电装机机、控制机、装载机、铰接矿车、宽体矿车、小型露天矿车）+ 在线询价">
    
      <button type="button" class="js-inquiry" data-model="MT720" data-title="MT720 车载无线终端" style="left:54.6875%;top:80.0498753117207%;width:13.59375%;height:6.982543640897756%;" aria-label="MT720 车载无线终端 在线询价" title="在线询价"></button>
    </section>

    <!-- 模块 3：核心规格参数表（5 行 3 列：序号 / Parameters / 描述） -->
    <section class="section" id="specs">
      <img src="assets/img/product-iot/mt720/mt720-specs-03.png" alt="MT720 核心规格参数表">
    </section>

    <!-- 模块 4：整站页脚（与一级页 footer 视觉一致） -->
    <div id="site-footer-new"></div>
    <script src="assets/js/site-footer.js"></script>

  </div>
<script src="assets/js/inquiry-modal.js"></script>
</body>
</html>
