<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CT600L 物联网终端 - 产品详情 - 天远科技集团</title>
  <style>
    :root {
      --header-h: 115px;
      --primary: #0b308e;
      --text: #3f3f3f;
      --phone: #949494;
      --bg: #ffffff;
      --max-w: 1920px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
      background: #f5f5f5;
      color: var(--text);
    }

    .page {
      max-width: var(--max-w);
      margin: 0 auto;
      background: var(--bg);
      overflow: hidden;
    }

    /* ===== 顶部导航（HTML 公共模块，sticky） ===== */
    .site-header {
      position: sticky;
      top: 0;
      height: var(--header-h);
      background: rgba(255, 255, 255, 0.98);
      z-index: 100;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 100%;
      padding: 0 80px;
    }

    .logo a {
      display: flex;
      align-items: center;
      height: var(--header-h);
    }

    .logo img {
      display: block;
      width: 260px;
      height: auto;
    }

    .main-nav {
      flex: 1;
      display: flex;
      justify-content: center;
    }

    .main-nav ul {
      display: flex;
      align-items: center;
      gap: 84px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .main-nav li { position: relative; }

    .main-nav a {
      display: block;
      font-size: 18px;
      line-height: var(--header-h);
      color: var(--text);
      text-decoration: none;
      white-space: nowrap;
      transition: color 0.2s;
    }

    .main-nav li.active > a { color: var(--primary); }

    .main-nav li.active::after {
      content: "";
      position: absolute;
      bottom: 7px;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--primary);
      border-radius: 2px;
    }

    .main-nav li:hover > a { color: var(--primary); }

    .dropdown {
      display: none;
      position: absolute;
      top: calc(var(--header-h) - 8px);
      left: 50%;
      transform: translateX(-50%);
      min-width: 220px;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      border-radius: 4px;
      padding: 8px 0;
    }

    .main-nav li:hover .dropdown { display: block; }

    .dropdown a {
      display: block;
      padding: 10px 24px;
      line-height: 1.5;
      font-size: 15px;
      color: var(--text);
    }

    .dropdown a:hover {
      color: var(--primary);
      background: #f7f8fa;
    }

    .phone {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 18px;
      color: var(--phone);
      white-space: nowrap;
    }

    .phone-icon {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
    }

    /* ===== 面包屑 ===== */
    .breadcrumb {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 20px 80px 0;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: var(--phone);
      background: var(--bg);
      flex-wrap: wrap;
    }

    .breadcrumb a {
      color: var(--text);
      text-decoration: none;
      transition: color 0.2s;
    }

    .breadcrumb a:hover { color: var(--primary); }

    .breadcrumb .sep { color: var(--phone); }

    .breadcrumb .current {
      color: var(--primary);
      font-weight: 500;
    }

    /* ===== 返回按钮 ===== */
    .back-link {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 16px 80px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--primary);
      text-decoration: none;
      background: var(--bg);
      transition: color 0.2s;
    }

    .back-link:hover {
      color: #082466;
      text-decoration: underline;
    }

    /* ===== 详情页模块图 ===== */
    .section { width: 100%; line-height: 0; }

    .section img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* ===== 基础响应式 ===== */
    @media (max-width: 1200px) {
      .header-inner { padding: 0 24px; }
      .main-nav ul { gap: 32px; }
      .breadcrumb, .back-link { padding-left: 24px; padding-right: 24px; }
    }
  
    /* ===== 产品图展示区：缩略图联动组件（变体 B：底图叠加式） =====
       实测基准：band = 1920 × 759；4 个缩略图框 x=160 w=152，top=170/278/386/494，h 均=104；
       主预览层覆盖「缩略图列右侧、文案区左侧」的产品区 (x[316:1044])：
       CT600L 各视角是产品不同姿态（姿态/位置均不同），且文案区 (x≥1050) 各角度不一致，
       故 stage 只覆盖产品区，切换时只换产品、缩略图与文案保持不变。 */
    #product { position: relative; }

    .mt-band {
      position: relative;
      width: 100%;
      aspect-ratio: 1920 / 759;
    }

    .mt-band .mt-base { display: block; width: 100%; height: auto; }

    .mt-band .mt-thumbs {
      position: absolute;
      left: 8.33334%;        /* x 160 / 1920（8.333333% 会被取整成 159.98px） */
      top: 0;
      width: 7.916667%;      /* w 152 / 1920 */
      height: 100%;
    }

    .mt-band .mt-thumb {
      position: absolute;
      left: 0;
      width: 100%;
      height: 13.702240%;    /* 104 / 759 */
      padding: 0;
      margin: 0;
      background: #ffffff;
      border: 1px solid #dadada;    /* 未选中：设计稿取样 rgb(218,218,218) */
      border-radius: 0;
      cursor: pointer;
      overflow: hidden;
      transition: border-color 0.2s ease;
    }

    .mt-band .mt-thumb:nth-child(1) { top: 22.397892%; }   /* y 170 / 759 */
    .mt-band .mt-thumb:nth-child(2) { top: 36.627141%; }   /* y 278 / 759 */
    .mt-band .mt-thumb:nth-child(3) { top: 50.856390%; }   /* y 386 / 759 */
    .mt-band .mt-thumb:nth-child(4) { top: 65.085639%; }   /* y 494 / 759 */

    .mt-band .mt-thumb.is-active {
      border-color: #0b308e;       /* 选中：设计稿取样 rgb(11,48,142) = --primary */
    }

    .mt-band .mt-thumb:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .mt-band .mt-thumb img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .mt-band .mt-stage {
      position: absolute;
      left: 16.45834%;       /* x 316 / 1920：缩略图列右侧（16.458333% 会被取整成 315px，略富余兜住） */
      top: 0;
      width: 37.916667%;     /* 728 / 1920：至文案区左侧 x1044 */
      height: 100%;
    }

    .mt-band .mt-view {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      z-index: 1;
      transition: opacity 0.3s ease;   /* 平滑过渡；旧图不透明垫底 → 不闪不白 */
    }

    .mt-band .mt-view.is-current  { opacity: 1; z-index: 3; }   /* 新图压最上层，0→1 淡入 */
    .mt-band .mt-view.is-outgoing { opacity: 1; z-index: 2; }   /* 旧图保持不透明，垫下面 */

    /* 无障碍：仅供屏幕阅读器的文本 */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

  </style>
</head>
<body>
  <div class="page">

    <!-- 顶部导航（HTML 公共模块，sticky 吸顶） -->
    <div id="site-header"></div>
<script src="assets/js/site-header.js"></script>

    <!-- 面包屑导航（产品列表 > 产品名称） -->
    <nav class="breadcrumb" aria-label="面包屑">

      <span class="sep">›</span>
>

    </nav>

    <a href="product-iot.html" class="back-link" aria-label="返回产品列表">‹ 返回产品列表</a>

        <img class="mt-view" src="assets/img/product-iot/ct600l/ct600l-view-2.png" alt="CT600L 车载无线终端 顶面视角大图" aria-hidden="true">

  <!-- 产品多角度缩略图联动：纯原生、无依赖。
       要点：4 张角度图随页面一同加载，点击只切 class，任何图都不移出 DOM
             → 旧图始终不透明垫底，因此不会闪烁、不会出现空白帧。 -->
  <script>
    (function () {
      var root = document.querySelector('[data-mt-gallery]');
      if (!root) return;

      // 顺序必须一致：mt-thumb 的第 i 个 ↔ mt-view 的第 i 个
      var thumbs = Array.prototype.slice.call(root.querySelectorAll('.mt-thumb'));
      var views = Array.prototype.slice.call(root.querySelectorAll('.mt-view'));
      var cur = 0;

      function select(i) {
        if (i === cur || !views[i]) return;      // 早退保护：重复点击同一张不做事

        thumbs.forEach(function (btn, k) {
          var on = (k === i);
          btn.classList.toggle('is-active', on);
          btn.setAttribute('aria-pressed', on ? 'true' : 'false');
        });

        views.forEach(function (view, k) {
          view.classList.remove('is-current', 'is-outgoing');
          if (k === i) {
            view.classList.add('is-current');       // 新图置于最上层，opacity 0 → 1 淡入
            view.removeAttribute('aria-hidden');
          } else if (k === cur) {
            view.classList.add('is-outgoing');      // 旧图保持 opacity 1，压在新图下面
            view.setAttribute('aria-hidden', 'true');
          } else {
            view.setAttribute('aria-hidden', 'true');
          }
        });

        cur = i;
      }

      thumbs.forEach(function (btn, i) {
        btn.addEventListener('click', function () { select(i); });
      });
    })();
  </script>
<script src="assets/js/inquiry-modal.js"></script>
